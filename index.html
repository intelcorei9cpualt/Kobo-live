<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kobo Live</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 20px; }
        video { width: 100%; max-width: 800px; border-radius: 8px; background: #000; }
        .controls { margin-top: 15px; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; cursor: pointer; }
        #status { margin-bottom: 15px; font-weight: bold; color: #4CAF50; }
    </style>
</head>
<body>

    <h1>Kobo Live 🟢</h1>
    <div id="status">Connecting to Kobo network...</div>

    <div>
        <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="controls" id="broadcasterControls" style="display:none;">
        <h3>Broadcaster Panel</h3>
        <input type="file" id="videoFile" accept="video/*">
        <button onclick="broadcastVideo()">Play & Broadcast to Viewers</button>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const statusDiv = document.getElementById('status');
        const broadcasterControls = document.getElementById('broadcasterControls');

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'kobo-default-room';
        let isBroadcaster = urlParams.get('host') === 'true';
        let connections = [];

        // FIX: The host MUST use the exact roomId so viewers know where to connect!
        // Viewers get a random ID (undefined) so they don't clash with the host.
        let peer = new Peer(isBroadcaster ? roomId : undefined); 

        peer.on('open', (id) => {
            if (isBroadcaster) {
                broadcasterControls.style.display = 'block';
                statusDiv.innerText = `Host Connected! Room ID: ${roomId}`;
                
                // FIX: Listen for viewers connecting immediately, not just after uploading
                peer.on('connection', (conn) => {
                    connections.push(conn);
                    conn.on('open', () => {
                        // If video is already playing when a viewer joins, catch them up
                        if (video.src) {
                            conn.send({ type: 'init', time: video.currentTime, paused: video.paused });
                        }
                    });
                });
            } else {
                statusDiv.innerText = `Viewer Mode. Connecting to room: ${roomId}...`;
                connectToBroadcaster(roomId);
            }
        });

        function broadcastVideo() {
            const fileInput = document.getElementById('videoFile');
            if (fileInput.files.length === 0) return alert('Please select a video first!');
            
            const file = fileInput.files[0];
            video.src = URL.createObjectURL(file);
            video.play();

            // Sync playback events to all connected viewers
            video.onplay = () => broadcastData({ type: 'play', time: video.currentTime });
            video.onpause = () => broadcastData({ type: 'pause', time: video.currentTime });
            video.onseeking = () => broadcastData({ type: 'seek', time: video.currentTime });
        }

        function broadcastData(data) {
            connections.forEach(conn => {
                if (conn.open) conn.send(data);
            });
        }

        function connectToBroadcaster(hostId) {
            let conn = peer.connect(hostId);
            
            conn.on('open', () => {
                statusDiv.innerText = "Connected to host! Waiting for video...";
            });

            conn.on('data', (data) => {
                statusDiv.innerText = "Receiving live stream...";
                if (data.type === 'init' || data.type === 'seek') {
                    video.currentTime = data.time;
                    if (data.type === 'init' && !data.paused) video.play();
                }
                if (data.type === 'play') {
                    if (video.paused) video.play();
                }
                if (data.type === 'pause') {
                    if (!video.paused) video.pause();
                }
            });

            conn.on('error', (err) => {
                statusDiv.innerText = "Failed to connect to host. Make sure the host is live.";
            });
        }
    </script>
</body>
</html>
