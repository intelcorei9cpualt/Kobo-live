<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kobo Live - Sync Engine</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 20px; }
        video { width: 100%; max-width: 800px; border-radius: 8px; background: #000; }
        .controls { margin-top: 15px; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; cursor: pointer; }
        #status { margin-bottom: 15px; font-weight: bold; color: #4CAF50; }
    </style>
</head>
<body>

    <h1>Kobo Live 🟢</h1>
    <div id="status">Loading Kobo stream...</div>

    <div>
        <!-- Note: Videos must be muted for autoplay policies to work smoothly inside iframes -->
        <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="controls" id="broadcasterControls" style="display:none;">
        <h3>Broadcaster Panel</h3>
        <input type="file" id="videoFile" accept="video/*">
        <p style="font-size: 14px; color: #aaa;">Upload your video file here. Playback commands will sync automatically to all review readers.</p>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const statusDiv = document.getElementById('status');
        const broadcasterControls = document.getElementById('broadcasterControls');

        const urlParams = new URLSearchParams(window.location.search);
        const isBroadcaster = urlParams.get('host') === 'true';
        const room = urlParams.get('room') || 'default-room';

        // Using a free public JSON storage worker as a relay sync buffer
        const syncChannelUrl = `https://api.jsonbin.io/v3/b/647188718e4aa6225ea3b111/latest`; // Replace or use a local storage simulation key for testing

        if (isBroadcaster) {
            broadcasterControls.style.display = 'block';
            statusDiv.innerText = "Host Mode Active.";

            document.getElementById('videoFile').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    video.src = URL.createObjectURL(file);
                    statusDiv.innerText = "Video loaded. Press play to start syncing.";
                }
            });

            // As the host plays/seeks, broadcast state locally or to storage
            setInterval(() => {
                if (!video.paused) {
                    localStorage.setItem(`kobo_state_${room}`, JSON.stringify({
                        time: video.currentTime,
                        paused: video.paused,
                        updatedAt: Date.now()
                    }));
                }
            }, 1000);

            video.onplay = () => syncState(false);
            video.onpause = () => syncState(true);
            
        } else {
            statusDiv.innerText = "Viewer Mode (Synced via Kobo Network)";
            
            // Viewers poll localStorage (or a free sync endpoint) to match the host
            setInterval(() => {
                const stateData = localStorage.getItem(`kobo_state_${room}`);
                if (stateData) {
                    const state = JSON.parse(stateData);
                    // If time drifts by more than 1.5 seconds, auto-correct the viewer
                    if (Math.abs(video.currentTime - state.time) > 1.5) {
                        video.currentTime = state.time;
                    }
                    if (state.paused && !video.paused) {
                        video.pause();
                    } else if (!state.paused && video.paused) {
                        video.play().catch(() => {/* Handles browser autoplay blocks */});
                    }
                }
            }, 1500);
        }

        function syncState(isPaused) {
            localStorage.setItem(`kobo_state_${room}`, JSON.stringify({
                time: video.currentTime,
                paused: isPaused,
                updatedAt: Date.now()
            }));
        }
    </script>
</body>
</html>
